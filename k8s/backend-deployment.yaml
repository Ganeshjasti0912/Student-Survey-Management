apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-survey-backend
  labels:
    app: student-survey-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-survey-backend
  template:
    metadata:
      labels:
        app: student-survey-backend
    spec:
      containers:
        - name: backend
          image: ganesh0912/student-survey-backend:1.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:mysql://survey-details.cvuwgwywmpvm.us-east-2.rds.amazonaws.com:3306/surveydb"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: survey-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: survey-db-secret
                  key: DB_PASSWORD
